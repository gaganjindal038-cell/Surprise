<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Boot Screen -->
    <main id="boot-screen">
        <div class="terminal">

            <div class="terminal-header">
                SECURE TERMINAL v1.0
            </div>

            <div id="terminal-output"></div>

            <div class="cursor-row">
                <span class="cursor"></span>
            </div>

        </div>
    </main>

    <!-- Authentication Screen -->
    <main id="auth-screen" class="hidden">

        <div class="card">

            <h1>Identity Verification Required</h1>

            <p>
                Welcome, Agent.
                <br><br>
                Clearance has not yet been granted.
                <br>
                Complete authentication to access the case file.
            </p>

            <button id="startButton">
                Begin Investigation
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
